# The local demo stack. Use it only on your own computer. Read deploy/DEMO.md.
# It adds to deploy/docker-compose.yml:
# - the prebuilt images annoudio-app:demo and annoudio-worker:demo (no build);
# - the app on 127.0.0.1:3500;
# - mailpit, a mail catcher: the app sends the login codes to it, and you read
#   them on http://127.0.0.1:8025. No mail leaves the computer.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml \
#     --env-file deploy/demo.env -p annoudio-demo up -d --wait
name: annoudio-demo

services:
  app:
    image: annoudio-app:demo
    build: !reset null
    ports:
      - '127.0.0.1:3500:3000'
    depends_on:
      mailpit:
        condition: service_started
  worker:
    image: annoudio-worker:demo
    build: !reset null
  mailpit:
    image: axllent/mailpit:v1.29.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
