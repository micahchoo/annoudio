# For a run on your own computer or a server without Dokploy or Coolify.
# It publishes the app on 127.0.0.1 only. Put your own HTTPS proxy in front for a public server.
#
#   cp deploy/.env.example deploy/.env      # then set the values
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.example.yml up -d --wait
#   open http://localhost:${ANNOUDIO_PORT:-3000}/admin
#
# Set ANNOUDIO_PORT in deploy/.env to use a different port.
services:
  app:
    ports:
      - '127.0.0.1:${ANNOUDIO_PORT:-3000}:3000'
